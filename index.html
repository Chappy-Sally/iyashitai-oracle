<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>癒し隊、出動中！｜介護する人のためのオラクルカード</title>
<meta name="description" content="介護をがんばるあなたへ。気持ちを選ぶと、チャッピー＆サリーとミカド＆メルから、やさしいカードが届きます。">
<style>
  :root{
    --purple:#5b4b9e; --purple-dark:#463a7d; --lav:#efe7fb; --gold:#c9a227; --gold-dark:#a8842a;
    --ink:#4a3f78;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
    background:linear-gradient(180deg,#f6f0fd 0%,#ece1fa 55%,#e6d8f8 100%);
    min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 40px; position:relative;}
  .sparkle{position:absolute; color:var(--gold); opacity:.55; font-size:15px; pointer-events:none;}
  .hero{
    border-radius:24px; padding:4px;
    background:linear-gradient(135deg,#f3d97b,#c9a227,#f7e79a,#b98a1f);
    box-shadow:0 10px 28px rgba(91,75,158,.25);
  }
  .hero img{display:block; width:100%; height:auto; border-radius:20px;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  .band{
    margin:18px auto 6px; max-width:430px; background:rgba(255,255,255,.82);
    border:1.5px solid var(--gold); border-radius:20px; padding:12px 10px;
    text-align:center; color:var(--gold-dark); font-weight:700; line-height:1.5;
    font-size:clamp(17px,4.6vw,21px); letter-spacing:.04em;
    display:flex; flex-direction:column; align-items:center;
  }
  .band .row{display:flex; align-items:center; gap:10px; white-space:nowrap;}
  .band .star{color:var(--gold); font-size:13px;}
  .guide{text-align:center; color:var(--purple); font-size:clamp(16px,4.4vw,19px); line-height:1.7; margin:16px 4px 4px;}
  .panel{
    margin-top:18px; background:rgba(255,255,255,.65); border:1px solid rgba(201,162,39,.35);
    border-radius:22px; padding:18px 14px 20px; box-shadow:0 6px 20px rgba(91,75,158,.10);
  }
  .sec-title{
    text-align:center; color:var(--purple-dark); font-weight:700; font-size:clamp(17px,4.6vw,20px); margin:2px 0 4px;
  }
  .sec-title::after{content:""; display:block; width:120px; height:3px; margin:8px auto 12px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent); border-radius:2px;}
  .chips{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .chip{
    appearance:none; border:1.5px solid #cbbcf0; background:#fff; color:var(--purple);
    border-radius:14px; padding:12px 4px; font-size:clamp(13px,3.6vw,15.5px); font-weight:700;
    white-space:nowrap; cursor:pointer; font-family:inherit; transition:all .15s;
  }
  .chip[aria-pressed="true"]{
    background:linear-gradient(160deg,#7a63c9,#5b4b9e); color:#fff; border-color:#5b4b9e;
    box-shadow:0 4px 12px rgba(91,75,158,.35);
  }
  .free-label{display:block; margin:18px 2px 8px; color:var(--purple-dark); font-weight:700; font-size:16px;}
  .free-label small{color:#8a7bb8; font-weight:400;}
  textarea{
    width:100%; border:1.5px solid #cbbcf0; border-radius:14px; padding:12px; font-size:16px;
    font-family:inherit; color:var(--ink); background:#fff; resize:vertical; min-height:56px;
  }
  textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .draw-btn{
    display:block; width:100%; margin-top:20px; padding:17px; border:none; border-radius:16px; cursor:pointer;
    font-family:inherit; font-size:clamp(18px,5vw,21px); font-weight:800; letter-spacing:.05em; color:#5a4300;
    background:linear-gradient(160deg,#f7e79a,#e9c94f 55%,#d9ae2e);
    box-shadow:0 8px 20px rgba(201,162,39,.45);
  }
  .draw-btn:disabled{background:linear-gradient(160deg,#e3dcf2,#cfc4e8); color:#8a7bb8; box-shadow:none; cursor:default;}
  .hint{text-align:center; color:#8a7bb8; font-size:13.5px; margin-top:10px;}
  .loading{text-align:center; color:var(--purple); padding:34px 0 8px; font-size:17px;}
  .loading .spin{display:inline-block; animation:spin 1.6s linear infinite; color:var(--gold); font-size:22px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .result-head{text-align:center; margin-top:6px;}
  .result-head .from{color:var(--gold-dark); font-weight:700; letter-spacing:.08em; font-size:clamp(15px,4.2vw,18px);}
  .result-head .arrived{color:var(--purple); font-weight:800; font-size:clamp(23px,6.4vw,29px); margin-top:8px;}
  .card-frame{
    margin:18px auto 0; max-width:430px; border-radius:24px; padding:4px;
    background:linear-gradient(135deg,#f3d97b,#c9a227,#f7e79a,#b98a1f);
    box-shadow:0 12px 30px rgba(91,75,158,.28);
    animation:fadeUp .6s ease both;
  }
  .card-frame img{display:block; width:100%; height:auto; border-radius:20px;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px) scale(.98)} to{opacity:1; transform:none}}
  .msg-box{
    margin:18px auto 0; max-width:430px; background:rgba(255,255,255,.9); border:1.5px solid rgba(201,162,39,.55);
    border-radius:20px; padding:10px 20px 20px; text-align:center;
  }
  .msg-box .star{color:var(--gold); font-size:17px; margin:4px 0 6px;}
  .msg-box .msg{color:var(--purple-dark); font-size:clamp(16.5px,4.6vw,19px); line-height:1.85; white-space:pre-line;}
  .btn-col{max-width:430px; margin:18px auto 0; display:flex; flex-direction:column; gap:11px;}
  .btn-sub{
    padding:14px; border-radius:14px; border:1.5px solid #b7a6e6; background:#fff; color:var(--purple);
    font-family:inherit; font-size:16.5px; font-weight:700; cursor:pointer;
  }
  footer{margin-top:30px; text-align:center; color:#9a8bc4; font-size:12px; line-height:1.7; padding:0 8px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <span class="sparkle" style="top:8px; left:6px;">✦</span>
  <span class="sparkle" style="top:120px; right:4px;">✦</span>
  <span class="sparkle" style="top:300px; left:2px;">✦</span>

  <!-- 入力画面 -->
  <section id="view-input">
    <div class="hero" id="hero"><img src="key_visual.jpg" alt="癒し隊、出動中！ チャッピー＆サリーとミカド＆メルがマントで飛ぶイラスト"></div>
    <h1 class="sr-only">癒し隊、出動中！</h1>
    <div class="band" aria-label="チャッピー＆サリー、ミカド＆メルがお届け">
      <span class="row">チャッピー＆サリー</span>
      <span class="row"><span class="star">✦</span>ミカド＆メル<span class="star">✦</span></span>
      <span class="row">がお届け</span>
    </div>
    <p class="guide">今の気持ちを選んでね。<br>あなたへのカードが届くよ。</p>

    <div class="panel">
      <p class="sec-title">今の気持ち（いくつでも選べるよ）</p>
      <div class="chips" id="chips"></div>
      <label class="free-label" for="free-text">ひとこと書いてもいいよ <small>（任意）</small></label>
      <textarea id="free-text" rows="2" placeholder="今の気持ちを自由に書いてもいいよ"></textarea>
      <button class="draw-btn" id="draw-btn">カードを引く ✦</button>
      <p class="hint">気持ちは選ばなくても引けるよ</p>
    </div>
  </section>

  <!-- 読み込み中 -->
  <section id="view-loading" class="hidden">
    <p class="loading"><span class="spin">✦</span><br>カードを届けています…</p>
  </section>

  <!-- 結果画面 -->
  <section id="view-result" class="hidden">
    <div class="result-head">
      <div class="from">― 癒し隊から、あなたへ ―</div>
      <div class="arrived">このカードが届いたよ</div>
    </div>
    <div class="card-frame"><img id="card-img" src="" alt=""></div>
    <div class="msg-box">
      <div class="star">✦</div>
      <div class="msg" id="card-msg"></div>
    </div>
    <div class="btn-col">
      <button class="draw-btn" id="again-btn" style="margin-top:0;">同じ気持ちでもう一枚</button>
      <button class="btn-sub" id="back-btn">気持ちを選びなおす</button>
    </div>
  </section>

  <footer>このカードは、気持ちをやわらげるためのイメージの贈りものです。<br>医療や専門的な支援の代わりにはなりません。</footer>
</div>

<script>
const CARDS = [{"id": 1, "title": "もう頑張らなくていいよ", "tags": ["疲れた", "少しほっとしたい"], "message": "今日はもう、十分がんばったね。\n休むのも、だいじな役目だよ。\nあとはゆっくり、ほっとしていい時間だよ。", "image": "card_01.webp"}, {"id": 2, "title": "小さな休憩", "tags": ["疲れた"], "message": "5分だけ、腰をおろしてみて。\n世界は、その間もちゃんと回っているよ。\nほんの少しの休憩が、心の充電になるよ。", "image": "card_02.webp"}, {"id": 3, "title": "ほっと一息", "tags": ["少しほっとしたい", "疲れた"], "message": "あたたかい飲み物を、両手でそっと持ってみて。\n湯気の向こうに、ほっとする時間が広がるよ。", "image": "card_03.webp"}, {"id": 4, "title": "そばにいるよ", "tags": ["誰かにわかってほしい", "孤独を感じる"], "message": "言葉にならない気持ちも、ちゃんとそばにあるよ。\nひとりで抱えこまなくて大丈夫だよ。", "image": "card_04.webp"}, {"id": 5, "title": "一人で抱えないで", "tags": ["孤独を感じる", "誰かにわかってほしい"], "message": "全部をひとりで背負わなくていいよ。\n少しだけ分けてみても、あなたの優しさは変わらないよ。", "image": "card_05.webp"}, {"id": 6, "title": "泣いてもいいよ", "tags": ["悲しい"], "message": "涙は弱さじゃないよ。心のお洗濯だよ。\n流れたあとには、少しだけすっきりした空が見えるよ。", "image": "card_06.webp"}, {"id": 7, "title": "責めなくていいよ", "tags": ["自分を責めている"], "message": "できなかったことより、やってきたことを見てみて。\n今日ここまで来ただけでも、じゅうぶんえらいよ。", "image": "card_07.webp"}, {"id": 8, "title": "ゆっくりで大丈夫", "tags": ["不安がある"], "message": "先のことは、今日は今日の分だけでいいよ。\n一歩ずつで大丈夫。急がなくていいんだよ。", "image": "card_08.webp"}, {"id": 9, "title": "深呼吸しよう", "tags": ["イライラする", "不安がある"], "message": "吸って、吐いて。\nざわざわを、そっと空に返してみて。\n肩の力が、少しだけゆるむよ。", "image": "card_09.webp"}, {"id": 10, "title": "よくやってるよ", "tags": ["疲れた", "誰かにわかってほしい"], "message": "誰も見ていなくても、ちゃんと届いているよ。\n今日のあなたも、よくやってるよ。", "image": "card_10.webp"}, {"id": 11, "title": "おやつ休憩", "tags": ["少しほっとしたい"], "message": "小さな甘いものが、心をほどくこともあるよ。\nチャッピーの大好きなたまごボーロみたいな、ほっとするひとくちをどうぞ。", "image": "card_11.webp"}, {"id": 12, "title": "みんなでお昼寝", "tags": ["疲れた", "少しほっとしたい"], "message": "眠るのはサボりじゃないよ。充電だよ。\n目を閉じて、すこしだけ夢の国へ行っておいで。", "image": "card_12.webp"}, {"id": 13, "title": "助けてくれる人いるかもよ", "tags": ["孤独を感じる", "誰かにわかってほしい"], "message": "「助けて」って、言ってもいいんだよ。\nもしかしたら、手を貸してくれる人がそばにいるかもしれないよ。", "image": "card_13.webp"}, {"id": 14, "title": "静かに見つめる", "tags": ["自分を責めている"], "message": "自分を裁く代わりに、静かに眺めてみて。\nできなかった日も、あなたはここにいるよ。", "image": "card_14.webp"}, {"id": 15, "title": "月の明かり", "tags": ["不安がある", "悲しい"], "message": "暗い夜にも、見守る光はあるよ。\n月の明かりは、静かにあなたを照らしているよ。", "image": "card_15.webp"}, {"id": 16, "title": "ここにいていいよ", "tags": ["孤独を感じる", "少しほっとしたい"], "message": "何かを話したり、頑張ったりしなくてもいいよ。\nただここにいるだけで、いいんだよ。", "image": "card_16.webp"}, {"id": 17, "title": "ちょっと忘れてみよう", "tags": ["イライラする", "疲れた"], "message": "気になることを、今だけ少し横に置いてみて。\n川の流れを眺めるみたいに、頭を空っぽにする時間も大事だよ。", "image": "card_17.webp"}, {"id": 18, "title": "そのままでいいよ", "tags": ["自分を責めている", "少しほっとしたい"], "message": "がんばれない日があっても、大丈夫。\n何かができても、できなくても、あなたの大切さは変わらないよ。", "image": "card_18.webp"}, {"id": 19, "title": "夜明けはもうすぐ", "tags": ["悲しい", "不安がある"], "message": "長い夜も、必ず朝の側へ進んでいるよ。\n空は少しずつ明るくなっている。夜明けはもうすぐだよ。", "image": "card_19.webp"}, {"id": 20, "title": "心をゆるめてみて", "tags": ["自分を責めている", "少しほっとしたい"], "message": "ずっと頑張っていると、心もぎゅっと固くなるよね。\n今は少しだけ、力を抜いてみてもいいんだよ。", "image": "card_20.webp"}, {"id": 21, "title": "目を閉じて", "tags": ["疲れた"], "message": "少し目を閉じるだけでも、心は休めるよ。\n暗闇の向こうで、ほっとする時間が待っているよ。", "image": "card_21.webp"}, {"id": 22, "title": "一人じゃないよ", "tags": ["孤独を感じる"], "message": "見えないだけで、つながりはちゃんとあるよ。\nどこかで、同じ気持ちの人が、今日もがんばっているよ。", "image": "card_22.webp"}, {"id": 23, "title": "流れにまかせて", "tags": ["疲れた", "イライラする"], "message": "止まらなくていいよ。流れに任せる時間も必要だよ。\n川の水みたいに、心もゆっくり流れていいんだよ。", "image": "card_23.webp"}, {"id": 24, "title": "なんだかいい予感", "tags": ["少しほっとしたい", "不安がある"], "message": "理由はないけど、なんだかいい日になりそう。\nそんな小さな予感を、今日の味方にしてみて。", "image": "card_24.webp"}, {"id": 25, "title": "今日も大丈夫", "tags": ["不安がある", "疲れた"], "message": "今日も大丈夫。\n急がなくても、何かを頑張らなくてもいいよ。\nあなたのペースで過ごしてね。", "image": "card_25.webp"}, {"id": 26, "title": "肩の力を抜いて", "tags": ["疲れた", "イライラする"], "message": "気づくと、肩に力が入っていない？\nふーっと息を吐いて、肩をストンと落としてみて。", "image": "card_26.webp"}, {"id": 27, "title": "いいことあるよ", "tags": ["少しほっとしたい", "悲しい"], "message": "雨のあとには、光る景色が待っているよ。\n今日のいいことは、もう近くまで来ているかも。", "image": "card_27.webp"}, {"id": 28, "title": "ちょっと上を向いて", "tags": ["少しほっとしたい"], "message": "下ばかり見ていたら、たまには空を。\n広い空を見上げると、心も少し広がるよ。", "image": "card_28.webp"}, {"id": 29, "title": "言葉はいらないよ", "tags": ["誰かにわかってほしい", "孤独を感じる"], "message": "うまく言葉にできない日もあるよね。\n何も話さず、ただ一緒にいる時間も大切だよ。", "image": "card_29.webp"}, {"id": 30, "title": "今日もおつかれさま", "tags": ["疲れた", "少しほっとしたい"], "message": "今日も一日おつかれさま。\n家に帰る自分を、そっとねぎらってあげてね。", "image": "card_30.webp"}];
const FEELINGS = ["疲れた","イライラする","悲しい","自分を責めている","孤独を感じる","不安がある","誰かにわかってほしい","少しほっとしたい"];
const KEYWORDS = [
  {feeling:"疲れた", words:["眠れない","眠い","寝不足","夜勤","ねむい","眠"]},
  {feeling:"悲しい", words:["泣きたい","涙","つらい","悲しい","泣"]},
  {feeling:"イライラする", words:["イライラ","怒","ムカつく","むかつく"]},
  {feeling:"不安がある", words:["不安","心配","怖い","こわい"]},
  {feeling:"孤独を感じる", words:["寂しい","さみしい","ひとり","孤独","さびしい"]},
  {feeling:"誰かにわかってほしい", words:["わかって","聞いて","話したい","わかってほしい"]},
  {feeling:"自分を責めている", words:["自分が悪い","ダメだ","責め","だめだ"]},
  {feeling:"少しほっとしたい", words:["ほっと","癒し","休みたい","癒され"]}
];
const selected = new Set();
const chipsEl = document.getElementById('chips');
const freeText = document.getElementById('free-text');
const drawBtn = document.getElementById('draw-btn');

FEELINGS.forEach(f => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = f;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click', () => {
    if (selected.has(f)) { selected.delete(f); b.setAttribute('aria-pressed','false'); }
    else { selected.add(f); b.setAttribute('aria-pressed','true'); }
  });
  chipsEl.appendChild(b);
});

function effectiveFeelings(){
  const set = new Set(selected);
  const text = freeText.value;
  if (text) {
    for (const k of KEYWORDS) {
      if (k.words.some(w => text.includes(w))) set.add(k.feeling);
    }
  }
  return set;
}
function pickCard(){
  const feel = effectiveFeelings();
  const lastId = Number(localStorage.getItem('iyashitai_last') || 0);
  let pool = CARDS.filter(c => c.id !== lastId);
  if (pool.length === 0) pool = CARDS.slice();
  let total = 0;
  const weights = pool.map(c => {
    const m = c.tags.filter(t => feel.has(t)).length;
    const w = 1 + m * 4;
    total += w; return w;
  });
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function loadCardImage(card){
  return new Promise(resolve => {
    let attempt = 0;
    const started = Date.now();
    const safety = setTimeout(() => resolve(false), 12000);
    const tryLoad = () => {
      attempt++;
      const img = new Image();
      img.onload = () => {
        const wait = Math.max(0, 500 - (Date.now() - started));
        setTimeout(() => { clearTimeout(safety); resolve(true); }, wait);
      };
      img.onerror = () => {
        if (attempt >= 5) { clearTimeout(safety); resolve(false); }
        else setTimeout(tryLoad, 600 * attempt);
      };
      img.src = card.image + (attempt > 1 ? ('?retry=' + attempt) : '');
    };
    tryLoad();
  });
}
function show(view){
  for (const id of ['view-input','view-loading','view-result']) {
    document.getElementById(id).classList.toggle('hidden', id !== view);
  }
  window.scrollTo({top:0});
}
async function draw(){
  const card = pickCard();
  show('view-loading');
  await loadCardImage(card);
  const img = document.getElementById('card-img');
  img.src = card.image;
  img.alt = 'オラクルカード「' + card.title + '」';
  img.onerror = () => { img.src = card.image + '?retry=' + Date.now(); };
  document.getElementById('card-msg').textContent = card.message;
  localStorage.setItem('iyashitai_last', String(card.id));
  show('view-result');
}
drawBtn.addEventListener('click', draw);
document.getElementById('again-btn').addEventListener('click', draw);
document.getElementById('back-btn').addEventListener('click', () => {
  selected.clear();
  document.querySelectorAll('.chip').forEach(ch => ch.setAttribute('aria-pressed','false'));
  freeText.value = '';
  show('view-input');
});
</script>
</body>
</html>
